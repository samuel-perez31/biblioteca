<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f4d2e">
  <title>Registrar préstamo · Biblioteca escolar</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <aside class="menu" id="menu"></aside>
  <script src="menu.js"></script>
  <script src="datos.js"></script>

  <main>
    <h1>Registrar préstamo</h1>
    <p class="sub">Anota quién se lleva el material. La fecha y la hora se guardan solas.</p>

    <div class="layout">
      <section class="tarjeta">
        <div id="aviso" class="aviso" role="alert"></div>

        <div class="fila">
          <div>
            <label for="nombre">Nombre completo</label>
            <div class="sug-caja">
              <input id="nombre" placeholder="Ej. Martina López" autocomplete="off">
              <ul class="sugerencias" id="sug-nombre" role="listbox" hidden></ul>
            </div>
          </div>
          <div>
            <label for="curso">Curso</label>
            <input id="curso" placeholder="Ej. 6°2" autocomplete="off" maxlength="4" inputmode="numeric">
          </div>
        </div>

        <div class="cabecera-libros">
          <label>Material que se lleva</label>
          <span id="contador">0 materiales</span>
        </div>
        <div id="lista"></div>
        <button type="button" class="btn-borde" id="agregar">+ Añadir otro material</button>

        <div class="acciones">
          <button type="button" class="btn-verde" id="guardar" disabled>Guardar préstamo</button>
        </div>
      </section>

      <aside>
        <div class="nota">
          <h2>Una nota útil</h2>
          No hace falta buscar el material en un catálogo. Escribe el título tal como aparece en el ejemplar y la cantidad.
        </div>
      </aside>
    </div>
  </main>

  <script>
    const lista = document.getElementById('lista');
    const aviso = document.getElementById('aviso');
    const guardar = document.getElementById('guardar');
    const nombre = document.getElementById('nombre');
    const curso = document.getElementById('curso');
    const CURSO_VALIDO = /^\d°\d{1,2}$/;
    let avisoBloqueo = false; // el aviso actual es por material sin devolver

    // Solo números: el ° se agrega solo después del primer número (6 → 6°)
    curso.addEventListener('input', (e) => {
      const borrando = e.inputType && e.inputType.startsWith('delete');
      if (borrando && !curso.value.includes('°')) { curso.value = ''; return; }
      const d = curso.value.replace(/\D/g, '');
      curso.value = d ? d[0] + '°' + d.slice(1, 3) : '';
    });

    function mostrar(tipo, texto) {
      aviso.className = 'aviso ' + tipo;
      aviso.textContent = texto;
    }

    function agregarFila() {
      const fila = document.createElement('div');
      fila.className = 'libro';
      fila.innerHTML = `
        <div class="num"></div>
        <div class="sug-caja">
          <input class="titulo" placeholder="Título del material" aria-label="Título del material">
          <ul class="sugerencias" role="listbox" hidden></ul>
        </div>
        <div class="cant-fila">
          <span class="cant-etiq" aria-hidden="true">Cantidad</span>
          <div class="cant-caja" role="group" aria-label="Cantidad">
            <button type="button" class="paso bajar" aria-label="Disminuir cantidad">&minus;</button>
            <input class="cantidad" type="number" min="1" max="99" value="1" inputmode="numeric" aria-label="Cantidad">
            <button type="button" class="paso subir" aria-label="Aumentar cantidad">+</button>
          </div>
        </div>
        <button type="button" class="btn-quitar" aria-label="Quitar material">×</button>`;
      fila.querySelector('.btn-quitar').onclick = () => {
        if (lista.children.length > 1) { fila.remove(); actualizar(); }
      };
      montarSugerencias(
        fila.querySelector('.titulo'),
        fila.querySelector('.sugerencias'),
        consultarTitulos,
        estadoSug);
      const cantidad = fila.querySelector('.cantidad');
      // Si escriben a mano un valor raro, se corrige a un número entre 1 y 99
      cantidad.addEventListener('change', () => {
        cantidad.value = Math.min(99, Math.max(1, Math.round(Number(cantidad.value) || 1)));
        actualizar();
      });
      fila.querySelector('.subir').onclick = () => moverCantidad(cantidad, 1);
      fila.querySelector('.bajar').onclick = () => moverCantidad(cantidad, -1);
      lista.appendChild(fila);
      actualizar();
    }

    // Sube o baja la cantidad con los botones − y +; va de 1 a 99
    function moverCantidad(cantidad, delta) {
      const v = Math.min(99, Math.max(1, (Number(cantidad.value) || 1) + delta));
      if (String(v) === cantidad.value) return;
      cantidad.value = v;
      cantidad.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function actualizar() {
      [...lista.children].forEach((f, i) => {
        f.querySelector('.num').textContent = i + 1;
        // El botón − se apaga en 1 y el + se apaga en 99
        const cant = Number(f.querySelector('.cantidad').value) || 1;
        f.querySelector('.bajar').disabled = cant <= 1;
        f.querySelector('.subir').disabled = cant >= 99;
      });
      const llenos = [...lista.querySelectorAll('.titulo')].filter(t => t.value.trim()).length;
      document.getElementById('contador').textContent = llenos + (llenos === 1 ? ' material' : ' materiales');

      // Solo se puede pedir hasta lo disponible del catálogo; los títulos que no
      // están en el catálogo no se pueden pedir si tienen copias sin devolver
      const problemas = [];
      let disp, pend;
      try { disp = Datos.disponibilidad(); } catch { disp = new Map(); }
      try { pend = Datos.pendientes(); } catch { pend = new Map(); }
      const pedidos = new Map();
      for (const f of lista.children) {
        const titulo = f.querySelector('.titulo').value.trim();
        if (!titulo) continue;
        const n = Number(f.querySelector('.cantidad').value) || 1;
        const k = titulo.toLowerCase();
        const acum = pedidos.get(k) || { titulo, n: 0 };
        acum.n += n;
        pedidos.set(k, acum);
      }
      for (const [k, x] of pedidos) {
        if (disp.has(k)) {
          const quedan = disp.get(k).disponibles;
          if (x.n > quedan) problemas.push('"' + x.titulo + '" (quedan ' + quedan + ')');
        } else {
          const n = pend.get(k) || 0;
          if (n) problemas.push('"' + x.titulo + '" (' + n + ' sin devolver)');
        }
      }
      if (problemas.length) {
        mostrar('error', 'No se puede pedir: ' + problemas.join(', ') + '.');
        avisoBloqueo = true;
      } else if (avisoBloqueo) {
        aviso.className = 'aviso';
        aviso.textContent = '';
        avisoBloqueo = false;
      }

      guardar.disabled = !(nombre.value.trim() && CURSO_VALIDO.test(curso.value) && llenos > 0) ||
        problemas.length > 0;
    }

    document.addEventListener('input', actualizar);
    document.getElementById('agregar').onclick = agregarFila;

    guardar.onclick = async () => {
      const materiales = [...lista.children]
        .map(f => ({
          material: f.querySelector('.titulo').value.trim(),
          cantidad: Number(f.querySelector('.cantidad').value) || 1
        }))
        .filter(m => m.material);

      guardar.disabled = true;
      try {
        Datos.registrar({ nombre: nombre.value, curso: curso.value, materiales });
        mostrar('ok', 'Préstamo guardado. Puedes registrar otro.');
        nombre.value = ''; curso.value = ''; lista.innerHTML = '';
        agregarFila();
      } catch (e) {
        mostrar('error', 'No se pudo guardar: ' + e.message + '. Revisa los datos e inténtalo de nuevo.');
        actualizar();
      }
    };

    // ── Autocompletado: sugiere profesores y materiales de la base de datos ──
    let contadorSug = 0;

    function ordenarPorPrefijo(q, textos) {
      const p = q.toLowerCase();
      return [...new Set(textos)]
        .sort((a, b) =>
          (b.toLowerCase().startsWith(p) ? 1 : 0) - (a.toLowerCase().startsWith(p) ? 1 : 0))
        .slice(0, 7);
    }

    function consultarNombres(q) {
      return ordenarPorPrefijo(q, Datos.profesores.listar(q)
        .map(p => (p.nombre + ' ' + p.apellido).trim()));
    }

    function consultarTitulos(q) {
      const bajo = s => String(s || '').toLowerCase();
      return ordenarPorPrefijo(q, Datos.inventario.listar(q)
        .filter(x => bajo(x.titulo).includes(bajo(q)))
        .map(x => String(x.titulo || '').trim()));
    }

    // Estado de un título para marcarlo en las sugerencias: sin ejemplares,
    // cuántos quedan, o en préstamo si no está en el catálogo
    function estadoSug(texto) {
      const k = String(texto || '').toLowerCase().trim();
      try {
        const info = Datos.disponibilidad().get(k);
        if (info) {
          if (info.disponibles <= 0) return { texto: ' · sin ejemplares', clase: 'sug-estado' };
          return { texto: ' · quedan ' + info.disponibles, clase: 'sug-estado quedan' };
        }
        const n = Datos.pendientes().get(k) || 0;
        return n ? { texto: ' · en préstamo', clase: 'sug-estado' } : null;
      } catch {
        return null;
      }
    }

    function montarSugerencias(input, ul, consultar, estado) {
      if (!ul.id) ul.id = 'sug-' + (++contadorSug);
      input.setAttribute('role', 'combobox');
      input.setAttribute('aria-autocomplete', 'list');
      input.setAttribute('aria-controls', ul.id);
      input.setAttribute('aria-expanded', 'false');

      let items = [];
      let activo = -1;
      let perdida = 0; // anula la orden de ocultar si el foco vuelve al campo
      let ultimo = ''; // último valor elegido: no debe volver a buscarlo

      function ocultar() {
        ul.hidden = true;
        ul.replaceChildren();
        input.setAttribute('aria-expanded', 'false');
        input.removeAttribute('aria-activedescendant');
        items = [];
        activo = -1;
      }

      function marcar(i) {
        activo = i;
        [...ul.children].forEach((li, k) => li.classList.toggle('activo', k === i));
        if (i >= 0) input.setAttribute('aria-activedescendant', ul.id + '-op-' + i);
        else input.removeAttribute('aria-activedescendant');
      }

      function elegir(i) {
        if (i < 0 || i >= items.length) return;
        input.value = items[i];
        ultimo = items[i];
        ocultar();
        // Dispara el mismo evento que teclear, para actualizar contador y botón guardar
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }

      function pintar() {
        ul.replaceChildren();
        items.forEach((texto, i) => {
          const li = document.createElement('li');
          li.id = ul.id + '-op-' + i;
          li.setAttribute('role', 'option');
          li.textContent = texto;
          if (estado) {
            const info = estado(texto);
            if (info) {
              const s = document.createElement('span');
              s.className = info.clase;
              s.textContent = info.texto;
              li.append(s);
            }
          }
          li.addEventListener('mousedown', e => { e.preventDefault(); elegir(i); });
          li.addEventListener('mouseenter', () => marcar(i));
          ul.append(li);
        });
        ul.hidden = items.length === 0;
        input.setAttribute('aria-expanded', String(items.length > 0));
      }

      input.addEventListener('input', () => {
        const q = input.value.trim();
        if (!q || input.value === ultimo) { ocultar(); return; }
        try { items = consultar(q); } catch { items = []; }
        activo = -1;
        pintar();
      });

      input.addEventListener('keydown', e => {
        if (e.key === 'Escape' && !ul.hidden) { e.stopPropagation(); ocultar(); return; }
        if (ul.hidden || items.length === 0) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); marcar((activo + 1) % items.length); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); marcar((activo - 1 + items.length) % items.length); }
        else if (e.key === 'Enter' && activo >= 0) { e.preventDefault(); elegir(activo); }
      });

      input.addEventListener('focus', () => { perdida++; });
      input.addEventListener('blur', () => {
        const turno = ++perdida;
        setTimeout(() => { if (turno === perdida) ocultar(); }, 130);
      });
    }

    montarSugerencias(nombre, document.getElementById('sug-nombre'), consultarNombres);

    agregarFila();
  </script>
</body>
</html>
